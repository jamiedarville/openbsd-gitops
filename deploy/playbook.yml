# Ships the configuration in this repository to the firewall.
#
# Everything runs on the machine running Ansible; the firewall is reached only
# through deploy/fw-helper, which calls the one privileged command the
# deployment account is allowed to run. No Python is needed on the firewall.
#
# New rules and network files are tried on the running firewall first and kept
# only after a fresh SSH connection still works. If they lock the deployment
# out, the firewall restores what it had by itself when the grace period ends.

- name: Deploy the firewall configuration
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    repo: "{{ playbook_dir }}/.."
    settings: "{{ lookup('file', repo + '/firewall.json') | from_json }}"
    grace: "{{ settings.graceSeconds | default(60) | int }}"
    helper: "{{ playbook_dir }}/fw-helper"
    work: "{{ lookup('env', 'FW_WORK_DIR') | default('/tmp', true) }}"
    pf_file: "{{ work }}/pf.conf"
    net_file: "{{ work }}/network.conf"
    dhcp_file: "{{ repo }}/dhcp/dhcpd.conf"
    # What a firewall with no network files from here reports.
    no_network: "sha256:{{ '# openbsd-gitops network\n' | hash('sha256') }}"

  environment:
    FW_HOST: "{{ settings.host }}"
    FW_PORT: "{{ settings.port | default(22) }}"
    FW_USER: "{{ settings.user }}"
    FW_HELPER: "{{ settings.helper | default('/usr/local/sbin/fcc-pfctl') }}"
    PYTHONPATH: "{{ repo }}/tui"

  tasks:
    - name: Join the rule files into one pf.conf
      ansible.builtin.shell: python3 -m fwgitops assemble > {{ pf_file | quote }}
      args:
        chdir: "{{ repo }}"
      changed_when: false

    - name: Work out the digest of the rules to deploy
      ansible.builtin.stat:
        path: "{{ pf_file }}"
        checksum_algorithm: sha256
      register: pf_stat

    - name: Join the network files into one
      ansible.builtin.shell: python3 -m fwgitops assemble-network > {{ net_file | quote }}
      args:
        chdir: "{{ repo }}"
      changed_when: false

    - name: Work out the digest of the network files to deploy
      ansible.builtin.stat:
        path: "{{ net_file }}"
        checksum_algorithm: sha256
      register: net_stat

    - name: Ask the firewall what it is running
      ansible.builtin.command: "{{ helper }} status"
      register: status_before
      changed_when: false

    - name: Read the firewall's answer
      ansible.builtin.set_fact:
        wanted: "sha256:{{ pf_stat.stat.checksum }}"
        wanted_net: "sha256:{{ net_stat.stat.checksum }}"
        before: "{{ dict(status_before.stdout_lines | select('search', '=') | map('split', '=', 1)) }}"

    # A helper from before network support says nothing about the network.
    - name: Note whether the network files have changed
      ansible.builtin.set_fact:
        net_changed: "{{ before.net_sha256 | default(no_network) != wanted_net }}"

    - name: Stop if the firewall's helper is too old for network files
      ansible.builtin.assert:
        that: before.net_sha256 is defined or not (net_changed | bool)
        fail_msg: The helper installed on the firewall does not support network files. Reinstall target/fcc-pfctl.

    - name: Stop if PF is switched off
      ansible.builtin.assert:
        that: before.pf == 'enabled'
        fail_msg: PF is not enabled on the firewall.

    - name: Stop if an earlier deployment is still waiting to be confirmed
      ansible.builtin.assert:
        that: before.armed == '0'
        fail_msg: A rollback from an earlier deployment is still pending on the firewall. Try again after its grace period.

    - name: Deploy the rules and the network files
      when: (net_changed | bool) or before.committed_sha256 != wanted or before.loaded_sha256 != wanted
      block:
        # Rules may name an interface that the network files are about to
        # create, so with a network change they are checked after it instead.
        - name: Have the firewall check the rules without loading them
          ansible.builtin.shell: "{{ helper | quote }} validate < {{ pf_file | quote }}"
          register: validated
          changed_when: false
          when: not (net_changed | bool)

        - name: Confirm the firewall received exactly these rules
          ansible.builtin.assert:
            that: validated.stdout is search(wanted)
            fail_msg: The firewall received different bytes than were sent.
          when: not (net_changed | bool)

        - name: Have the firewall check the network files without installing them
          ansible.builtin.shell: "{{ helper | quote }} net-validate < {{ net_file | quote }}"
          register: net_validated
          changed_when: false
          when: net_changed | bool

        - name: Confirm the firewall received exactly these network files
          ansible.builtin.assert:
            that: net_validated.stdout is search(wanted_net)
            fail_msg: The firewall received different bytes than were sent.
          when: net_changed | bool

        - name: Keep a copy of the current rules on the firewall
          ansible.builtin.command: "{{ helper }} backup"

        - name: Arm the firewall's rollback watchdog
          ansible.builtin.command: "{{ helper }} arm {{ grace }}"
          register: armed

        - name: Note that the firewall is about to be changed
          ansible.builtin.file:
            path: "{{ work }}/rules-were-loaded"
            state: touch
            mode: "0600"

        - name: Install the network files and bring the network up
          ansible.builtin.shell: "{{ helper | quote }} net-apply < {{ net_file | quote }}"
          when: net_changed | bool

        # Also when only the network changed: rules that use an interface's
        # address are worked out again from the new one.
        - name: Load the new rules into the running firewall
          ansible.builtin.shell: "{{ helper | quote }} apply < {{ pf_file | quote }}"

        - name: Reconnect to prove the firewall still lets us in
          ansible.builtin.command: "{{ helper }} status"
          register: status_applied
          changed_when: false

        - name: Confirm the firewall is running the new rules and network files
          ansible.builtin.assert:
            that:
              - status_applied.stdout is search('loaded_sha256=' + wanted)
              - not (net_changed | bool) or status_applied.stdout is search('net_sha256=' + wanted_net)
            fail_msg: The firewall is not running what was sent.

        - name: Keep the new rules and network files for good
          ansible.builtin.command: "{{ helper }} commit"

        - name: Confirm the firewall kept them
          ansible.builtin.command: "{{ helper }} status"
          register: status_after
          changed_when: false
          failed_when: >-
            status_after.stdout is not search('committed_sha256=' + wanted)
            or status_after.stdout is search('net_pending=1')

      rescue:
        - name: Undo the change
          ansible.builtin.command: "{{ helper }} rollback"
          register: rollback
          ignore_errors: true
          when: armed is defined and armed is not skipped

        - name: Wait for the firewall to undo the change by itself
          ansible.builtin.pause:
            seconds: "{{ grace | int + 15 }}"
          when: rollback is failed

        - name: Ask the firewall what it is running now
          ansible.builtin.command: "{{ helper }} status"
          register: status_recovered
          changed_when: false
          ignore_errors: true

        - name: Report the failed deployment
          ansible.builtin.fail:
            msg: >-
              The deployment failed at "{{ ansible_failed_task.name }}".
              {{ ansible_failed_result.stderr | default('', true) }}
              {% if status_recovered is failed %}
              The firewall cannot be reached, so what it is running is UNCONFIRMED. Check it at its console.
              {% elif status_recovered.stdout is search('armed=0') and status_recovered.stdout is search('loaded_sha256=' + before.committed_sha256) and status_recovered.stdout is search('net_sha256=' + before.net_sha256 | default('')) %}
              The firewall is back on its previous rules and network files.
              {% else %}
              The firewall answered but is not on its previous rules and network files. Check it.
              {% endif %}

    - name: Check whether there is a DHCP configuration to deploy
      ansible.builtin.shell: grep -Eqv '^[[:space:]]*(#|$)' {{ dhcp_file | quote }}
      register: dhcp_active
      changed_when: false
      failed_when: false

    - name: Deploy the DHCP configuration
      block:
        - name: Work out the digest of the DHCP configuration
          ansible.builtin.stat:
            path: "{{ dhcp_file }}"
            checksum_algorithm: sha256
          register: dhcp_stat
          when: dhcp_active.rc == 0

        - name: Stop if the firewall's helper is too old for DHCP
          ansible.builtin.assert:
            that: before.dhcpd_sha256 is defined
            fail_msg: The helper installed on the firewall does not support DHCP. Reinstall target/fcc-pfctl.
          when: dhcp_active.rc == 0

        # Also when the file is the same but dhcpd is not running, or the
        # network changed: dhcpd only sees the interfaces it started with.
        - name: Install the DHCP configuration and start dhcpd
          ansible.builtin.shell: "{{ helper | quote }} dhcpd-apply < {{ dhcp_file | quote }}"
          when: >-
            dhcp_active.rc == 0 and
            (before.dhcpd_sha256 != 'sha256:' + dhcp_stat.stat.checksum
            or before.dhcpd | default('running') != 'running'
            or (net_changed | bool))

        # Only a configuration that came from here is ever taken away.
        - name: Remove the DHCP configuration and stop dhcpd
          ansible.builtin.command: "{{ helper }} dhcpd-remove"
          when: dhcp_active.rc != 0 and before.dhcpd_managed | default('0') == '1'

      rescue:
        # The deployer reads this to tell a DHCP failure, which it retries,
        # from a failure of the rules, which it does not.
        - name: Note that only the DHCP configuration failed
          ansible.builtin.file:
            path: "{{ work }}/dhcp-failed"
            state: touch
            mode: "0600"

        - name: Report the failed DHCP deployment
          ansible.builtin.fail:
            msg: >-
              The firewall rules are deployed, but the DHCP configuration was not installed:
              "{{ ansible_failed_task.name }}" failed.
              {{ ansible_failed_result.stderr | default(ansible_failed_result.msg | default(''), true) }}
