# Filter rules. The last matching rule wins, unless a rule says "quick".
#
# Nothing passes between networks until a rule here says so. For a network
# behind the firewall, such as the VLAN in network/hostname.vlan10:
#   pass in on vlan10 from (vlan10:network) to any               # may go anywhere
#   pass in on vlan20 from (vlan20:network) to ! (vlan10:network)  # anywhere but vlan10
#   antispoof quick for vlan10                                   # drop forged sources
# To keep SSH to a few machines, replace the SSH rule below with:
#   pass in proto tcp from <admins> to any port 22

block all  # Block everything that is not allowed below
pass out from any to any  # Let the firewall itself reach out
pass in proto tcp from any to any port 22  # SSH management: keep this
pass proto icmp from any to any  # Ping
