# DHCP server configuration (dhcpd.conf). Nothing is deployed while this file
# holds only comments; with a network in it, dhcpd is switched on and started.
# Emptying it again stops dhcpd. Each subnet needs an interface with an address
# in it: see network/.
#
# A network to hand out addresses on:
#   subnet 192.168.10.0 netmask 255.255.255.0 { range 192.168.10.100 192.168.10.200; option routers 192.168.10.1; option domain-name-servers 1.1.1.1; }
#
# A fixed address for one device:
#   host printer { hardware ethernet 00:11:22:33:44:55; fixed-address 192.168.10.50; }
