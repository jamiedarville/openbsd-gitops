# DNS resolver configuration (unbound.conf). Nothing is deployed while this
# file holds only comments; with a server in it, unbound is switched on and
# started. Emptying it again stops unbound and puts back the configuration
# OpenBSD came with.
#
# A resolver for one inside network, with a name of its own in it:
#   server:
#   	interface: 127.0.0.1
#   	interface: 192.168.10.1
#   	access-control: 192.168.10.0/24 allow
#   	local-data: "printer.home.arpa. IN A 192.168.10.50"
#
# The firewall accepts only the settings a resolver needs; see the README. A
# rule must let the network reach it, for example:
#   pass in on vlan10 proto { tcp, udp } from (vlan10:network) to (vlan10) port 53
# and DHCP must hand it out: option domain-name-servers 192.168.10.1;
