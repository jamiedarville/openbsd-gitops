# NAT and port forwards. Loaded after the settings and before the filter rules.
#
# Outbound NAT, so an inside network can reach the internet:
#   match out on egress inet from 192.168.10.0/24 to any nat-to (egress)
#
# Port forward, sending a port to a machine inside:
#   pass in on egress inet proto tcp from any to (egress) port 443 rdr-to 192.168.10.20
