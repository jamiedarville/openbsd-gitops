# NAT and port forwards. Loaded after the settings and before the filter rules.
#
# Outbound NAT, so an inside network can reach the internet:
#   match out on egress inet from (vlan10:network) to any nat-to (egress)
#
# In brackets, PF looks an interface's addresses up as it goes, so the rule
# can be written before the interface exists and follows it if it is
# renumbered. A plain range such as 192.168.10.0/24 works as well.
#
# Port forward, sending a port to a machine inside:
#   pass in on egress inet proto tcp from any to (egress) port 443 rdr-to 192.168.10.20
