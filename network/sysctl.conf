# Kernel settings for routing, installed as /etc/sysctl.conf. Nothing is
# deployed while this file holds only comments. The firewall accepts only
# net.inet.ip.forwarding and net.inet6.ip6.forwarding here.
#
# Pass packets between networks. Without this, NAT rules load and do nothing:
#   net.inet.ip.forwarding=1
#
# Interfaces go beside this file, one each, as OpenBSD writes them itself
# (see hostname.if(5)). A VLAN, as network/hostname.vlan10:
#   parent em1 vnetid 10
#   inet 192.168.10.1 255.255.255.0
#   up
# and the port under it, as network/hostname.em1:
#   up
# A fixed default route goes in network/mygate, as one IPv4 address.
